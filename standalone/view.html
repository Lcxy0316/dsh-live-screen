<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>实时画面 · Live Screen</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --line: #232830;
    --fg: #e6e9ef;
    --dim: #8b95a5;
    --accent: #4c9aff;
    --live: #35d07f;
    --warn: #f5a623;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }

  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex: 0 0 auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
  .dot.on { background: var(--live); box-shadow: 0 0 8px rgba(53,208,127,.8); }
  .title { font-weight: 600; letter-spacing: .2px; }
  .spacer { flex: 1; }
  .stat { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .stat b { color: var(--fg); font-weight: 600; }
  button { background: #1d2229; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
  button:hover { background: #262d36; border-color: #333c47; }
  button.primary { background: rgba(76,154,255,.16); border-color: rgba(76,154,255,.45); color: #a9caff; }

  #stage { position: relative; flex: 1 1 auto; display: flex; align-items: center;
    justify-content: center; overflow: hidden; background:
      repeating-conic-gradient(#101317 0% 25%, #0c0f12 0% 50%) 50%/18px 18px; }
  #screen { max-width: 100%; max-height: 100%; display: block; image-rendering: auto;
    outline: 1px solid rgba(255,255,255,.06); cursor: crosshair; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .ripple { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%; border: 2px solid var(--accent); opacity: .95;
    animation: ping .45s ease-out forwards; }
  @keyframes ping { to { transform: scale(2.1); opacity: 0; } }
  .cursor { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(76,154,255,.9);
    transition: transform .05s linear; }

  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    color: var(--dim); text-align: center; line-height: 1.8; }
  footer { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-top: 1px solid var(--line); background: var(--panel); color: var(--dim); font-size: 12px; }
  input[type=text] { flex: 1; background: #0f1216; border: 1px solid var(--line);
    color: var(--fg); border-radius: 6px; padding: 5px 9px; font-size: 12px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  .kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dot" id="dot"></span>
    <span class="title">实时画面</span>
    <span class="stat" id="mode">连接中…</span>
    <span class="spacer"></span>
    <span class="stat">FPS <b id="fps">–</b></span>
    <span class="stat">码率 <b id="kbps">–</b></span>
    <span class="stat">延迟 <b id="lat">–</b></span>
    <span class="stat" id="res">–</span>
    <button id="btn-input" class="primary" title="点击后在画面上点击/输入会真的作用到本机">输入：关</button>
    <button id="btn-reconnect">重连</button>
  </header>

  <div id="stage">
    <canvas id="screen" width="16" height="9"></canvas>
    <div id="overlay"></div>
    <div id="hint">等待第一帧…<br><span style="font-size:12px">画面来自本机屏幕采集，只用于观看</span></div>
  </div>

  <footer>
    <span class="kbd">输入开启后可点击/打字</span>
    <input type="text" id="textin" placeholder="输入文字后回车 → 发送到本机前台窗口" autocomplete="off" />
    <span class="stat" id="msg"></span>
  </footer>
</div>

<script>
(() => {
  const canvas = document.getElementById('screen')
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true })
  const overlay = document.getElementById('overlay')
  const dot = document.getElementById('dot')
  const elFps = document.getElementById('fps')
  const elKbps = document.getElementById('kbps')
  const elLat = document.getElementById('lat')
  const elRes = document.getElementById('res')
  const elMode = document.getElementById('mode')
  const elHint = document.getElementById('hint')
  const elMsg = document.getElementById('msg')
  const btnInput = document.getElementById('btn-input')
  const btnReconnect = document.getElementById('btn-reconnect')
  const textin = document.getElementById('textin')

  let ws = null
  let inputEnabled = false
  let srcW = 0, srcH = 0

  // ---- 统计 ----
  let frames = 0, bytes = 0, lastStat = performance.now()
  let lastDrawAt = 0, latSamples = []

  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'

  function connect () {
    try { if (ws) ws.close() } catch {}
    ws = new WebSocket(url)
    ws.binaryType = 'arraybuffer'
    elMode.textContent = '连接中…'
    dot.classList.remove('on')

    ws.onopen = () => {
      elMode.textContent = '已连接'
      dot.classList.add('on')
    }
    ws.onclose = () => {
      dot.classList.remove('on')
      elMode.textContent = '已断开 · 3s 后重连'
      setTimeout(connect, 3000)
    }
    ws.onerror = () => { elMode.textContent = '连接错误' }
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        try { const m = JSON.parse(ev.data); if (m.type === 'hello') {
          srcW = m.srcWidth || m.width; srcH = m.srcHeight || m.height
          elRes.textContent = (m.srcWidth && m.srcHeight ? m.srcWidth + '×' + m.srcHeight : '') + ' · ' + m.fps + 'fps'
        } } catch {}
        return
      }
      const buf = new Uint8Array(ev.data)
      frames++; bytes += buf.length
      const blob = new Blob([buf], { type: 'image/jpeg' })
      createImageBitmap(blob).then((bmp) => {
        if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
          canvas.width = bmp.width; canvas.height = bmp.height
        }
        ctx.drawImage(bmp, 0, 0)
        bmp.close()
        elHint.style.display = 'none'
        lastDrawAt = performance.now()
        document.getElementById('hint').style.display = 'none'
      }).catch(() => {})
    }
  }

  setInterval(() => {
    const now = performance.now()
    const dt = (now - lastStat) / 1000
    if (dt > 0) {
      elFps.textContent = (frames / dt).toFixed(1)
      elKbps.textContent = ((bytes * 8 / dt) / 1000).toFixed(0) + ' kbps'
    }
    frames = 0; bytes = 0; lastStat = now
    elLat.textContent = lastDrawAt ? (now - lastDrawAt).toFixed(0) + ' ms' : '–'
  }, 1000)

  // ---- 输入 ----
  btnInput.onclick = () => {
    inputEnabled = !inputEnabled
    btnInput.textContent = '输入：' + (inputEnabled ? '开' : '关')
    btnInput.style.background = inputEnabled ? 'rgba(53,208,127,.18)' : ''
    btnInput.style.borderColor = inputEnabled ? 'rgba(53,208,127,.5)' : ''
    btnInput.style.color = inputEnabled ? '#9be8bf' : ''
    canvas.style.cursor = inputEnabled ? 'none' : 'crosshair'
  }
  btnReconnect.onclick = connect

  function toScreen (ev) {
    const r = canvas.getBoundingClientRect()
    const x = (ev.clientX - r.left) / r.width * srcW
    const y = (ev.clientY - r.top) / r.height * srcH
    return { x: Math.round(x), y: Math.round(y), el: { x: ev.clientX - r.left, y: ev.clientY - r.top } }
  }

  function send (action) {
    if (!ws || ws.readyState !== 1) return
    ws.send(JSON.stringify({ type: 'action', action }))
  }

  function ripple (p) {
    const d = document.createElement('div')
    d.className = 'ripple'
    d.style.left = p.el.x + 'px'
    d.style.top = p.el.y + 'px'
    overlay.appendChild(d)
    setTimeout(() => d.remove(), 500)
  }

  const ghost = document.createElement('div')
  ghost.className = 'cursor'
  ghost.style.display = 'none'
  overlay.appendChild(ghost)

  canvas.addEventListener('mousemove', (ev) => {
    if (!inputEnabled || !srcW) return
    const p = toScreen(ev)
    ghost.style.display = 'block'
    ghost.style.left = p.el.x + 'px'
    ghost.style.top = p.el.y + 'px'
  })
  canvas.addEventListener('mousedown', (ev) => {
    if (!inputEnabled || !srcW) return
    ev.preventDefault()
    const p = toScreen(ev)
    ripple(p)
    send({ type: 'click', x: p.x, y: p.y, button: ev.button === 2 ? 'right' : ev.button === 1 ? 'middle' : 'left', count: 1 })
  })
  canvas.addEventListener('contextmenu', (ev) => ev.preventDefault())
  canvas.addEventListener('wheel', (ev) => {
    if (!inputEnabled) return
    ev.preventDefault()
    send({ type: 'scroll', dy: Math.sign(ev.deltaY) })
  }, { passive: false })

  document.addEventListener('keydown', (ev) => {
    if (!inputEnabled || document.activeElement === textin) return
    if (['Shift','Control','Alt','Meta','CapsLock'].includes(ev.key)) return
    ev.preventDefault()
    const vk = vkOf(ev)
    if (vk) { send({ type: 'key', vk, down: true }); setTimeout(() => send({ type: 'key', vk, down: false }), 30) }
  })

  function vkOf (ev) {
    const k = ev.key
    if (k.length === 1) {
      const c = k.toUpperCase().charCodeAt(0)
      if (c >= 65 && c <= 90) return c
      if (c >= 48 && c <= 57) return c
      const map = { ' ': 32, '.': 190, ',': 188, '/': 191, ';': 186, "'": 222, '[': 219, ']': 221, '\\': 220, '-': 189, '=': 187, '`': 192 }
      return map[k] ?? 0
    }
    const named = { Enter: 13, Backspace: 8, Tab: 9, Escape: 27, ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Delete: 46, Home: 36, End: 35, PageUp: 33, PageDown: 34 }
    return named[k] || 0
  }

  textin.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter') return
    const t = textin.value
    if (!t) return
    send({ type: 'type', text: t })
    textin.value = ''
    elMsg.textContent = '已发送 ' + t.length + ' 字符'
    setTimeout(() => { elMsg.textContent = '' }, 2000)
  })

  connect()
})()
</script>
</body>
</html>
